[project]
name = "supie"
version = "0.1.2"
description = "Python edge functions for Supabase."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "almostly" }]
keywords = ["supabase", "edge-functions", "serverless", "micropython", "pyodide", "deno"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12",
    "tomlkit>=0.13",  # editing supabase/config.toml without losing comments
]

[project.optional-dependencies]
models = ["onnx>=1.17", "pyyaml>=6"]  # supie model prepare and publish

[project.scripts]
supie = "supie.cli:app"

[project.urls]
Repository = "https://github.com/almostly/supie"

[dependency-groups]
dev = [
    "pytest>=8",
    "ty>=0.0.90",  # type checks, run by the ty hook (uv run ty check)
    "openpyxl>=3.1",  # writes the workbook the edge package test uploads
    "onnx>=1.17",  # builds the tiny model the ONNX tests serve
    "pyyaml>=6",  # reads MLmodel files in the publish tests
    # runs ONNX models in tests, standing in for the Edge Runtime; no wheels for 3.10
    "onnxruntime>=1.20; python_version >= '3.11'",
    "commitizen>=4",
    "matplotlib>=3.10.9",
    "ipython>=8.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supie"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["prototype"]

[tool.ruff.lint]
# ANN: every function in src/ and scripts/ is fully annotated. ANN401 is off:
# Any is the honest type for JSON values and for app state.
select = ["E4", "E7", "E9", "F", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"**/test_*.py" = ["ANN"]

[tool.ty.src]
exclude = ["prototype"]

[tool.ty.environment]
# the walkthrough notebook imports its diagram helpers from its own folder
extra-paths = ["examples/notebooks"]

[tool.ty.analysis]
# optional: mlflow for `supie model publish`; pydantic and openpyxl only inside
# the Pyodide test function, where requirements.txt installs them
allowed-unresolved-imports = ["mlflow", "mlflow.**", "pydantic", "openpyxl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: downloads a runtime from npm (cached after the first run)",
    "edge: runs functions on Supabase's Edge Runtime image (Docker)",
    "postgres: runs against Supabase's Postgres and PostgREST images (Docker)",
]

[tool.commitizen]
# Message format: `Area(<+|~|->): description`, where the symbol is what the change
# does to that area: + added, ~ changed, - removed. Example:
#   Build(+): Pyodide snapshots
name = "cz_customize"
version_provider = "pep621"
version_scheme = "semver"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
changelog_incremental = true

[tool.commitizen.customize]
message_template = "{{area}}({{change}}): {{description}}"
example = "Build(+): Pyodide snapshots"
schema = "<Area>(<+|~|->): <description>"
schema_pattern = "^[\\w .+/-]+\\([+~-]\\): .+"
bump_pattern = "^[\\w .+/-]+\\(([+~-])\\):"
commit_parser = "^(?P<scope>[\\w .+/-]+)\\((?P<change_type>[+~-])\\): (?P<message>.+)"
changelog_pattern = "^[\\w .+/-]+\\([+~-]\\):"
change_type_order = ["Added", "Changed", "Removed"]

[tool.commitizen.customize.change_type_map]
"+" = "Added"
"~" = "Changed"
"-" = "Removed"

[tool.commitizen.customize.bump_map]
"+" = "MINOR"
"-" = "MINOR"
"~" = "PATCH"

[[tool.commitizen.customize.questions]]
type = "input"
name = "area"
message = "Area (e.g. Runtime, Build, CLI, Supabase, Docs):"

[[tool.commitizen.customize.questions]]
type = "list"
name = "change"
message = "What does this do to it?"
choices = [
    { value = "+", name = "+ : added" },
    { value = "~", name = "~ : changed" },
    { value = "-", name = "- : removed" },
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "description"
message = "Short description of the change:"
