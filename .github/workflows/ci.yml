# Lint and tests on every pull request and on main. The edge job builds
# functions with both runtimes and runs them on Supabase's Edge Runtime image.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Hooks (ruff)
        if: matrix.python == '3.12'
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest -q -m "not edge"

      - name: Example
        run: uv run pytest -q examples

  edge:
    name: edge runtime (micropython, pyodide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked

      - name: Pull the Edge Runtime image
        run: docker pull public.ecr.aws/supabase/edge-runtime:v1.77.4

      - name: Edge tests
        run: uv run pytest -q -m edge
