# Lint and tests on every pull request and on main. The edge job builds
# functions with both runtimes, runs them on Supabase's Edge Runtime image, and
# tests workflow checkpoints against Supabase's Postgres and PostgREST.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Hooks (ruff)
        if: matrix.python == '3.12'
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest -q -m "not edge and not postgres"

      - name: Example
        run: uv run pytest -q examples

  edge:
    # Against the images pinned in tests/conftest.py, so a failure here means our
    # change broke something. upstream.yml tests what Supabase ships today.
    name: edge runtime and postgres (pinned images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --locked

      - name: Pull the images
        run: uv run python scripts/pull_images.py

      - name: Edge Runtime and Postgres tests
        run: uv run pytest -q -m "edge or postgres"
